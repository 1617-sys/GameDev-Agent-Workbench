<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameDev Agent Workbench</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">GA</div>
        <div>
          <div class="brand-title">GameDev Agent</div>
          <div class="brand-subtitle">AI Workflow Studio</div>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-view="workspace">工作台</button>
        <button class="nav-item" data-view="runs">运行记录</button>
        <button class="nav-item" data-view="artifacts">产物库</button>
        <button class="nav-item" data-view="settings">连接设置</button>
      </nav>

      <div class="sidebar-footer">
        <div class="connection-dot" id="connectionDot"></div>
        <span id="connectionText">未连接</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1>游戏设计工作台</h1>
          <p id="activeProjectText">选择项目后开始运行 Agent 工作流</p>
        </div>
        <div class="topbar-actions">
          <button class="ghost-button" id="refreshButton">刷新</button>
          <button class="primary-button" id="logoutButton">退出</button>
        </div>
      </header>

      <section class="auth-panel" id="authPanel">
        <div class="auth-card">
          <div class="auth-tabs">
            <button class="auth-tab active" id="showLoginButton" type="button">登录</button>
            <button class="auth-tab" id="showRegisterButton" type="button">注册</button>
          </div>
          <h2 id="authTitle">登录工作台</h2>
          <div class="form-grid">
            <label>
              用户名
              <input id="authUsername" autocomplete="username" placeholder="admin" />
            </label>
            <label>
              密码
              <input id="authPassword" type="password" autocomplete="current-password" placeholder="password" />
            </label>
          </div>
          <button class="primary-button wide" id="authSubmitButton">登录</button>
          <div class="message" id="authMessage"></div>
        </div>
      </section>

      <section class="view active" id="workspaceView">
        <div class="layout-grid">
          <section class="panel project-panel">
            <div class="panel-header">
              <div>
                <h2>项目</h2>
                <p>当前用户的游戏项目</p>
              </div>
              <button class="icon-button" id="newProjectButton" title="新建项目">+</button>
            </div>
            <div class="project-list" id="projectList"></div>
          </section>

          <section class="panel compose-panel">
            <div class="panel-header">
              <div>
                <h2>工作流运行</h2>
                <p>生成概念、核心循环与任务拆解</p>
              </div>
              <span class="pill" id="workflowStatus">READY</span>
            </div>
            <div class="form-grid">
              <label>
                标题
                <input id="workflowTitle" placeholder="像素地牢 Roguelike 设计" />
              </label>
              <label>
                Agent 类型
                <select id="agentType">
                  <option value="GAME_CONCEPT">游戏概念</option>
                  <option value="CORE_LOOP_DESIGN">核心循环</option>
                  <option value="TASK_BREAKDOWN">任务拆解</option>
                  <option value="REQUIREMENT_BREAKDOWN">需求拆解</option>
                  <option value="API_DESIGN">接口设计</option>
                  <option value="BUG_ANALYSIS">Bug 分析</option>
                  <option value="PROMPT_GENERATE">Prompt 生成</option>
                </select>
              </label>
            </div>
            <label>
              游戏想法 / Agent 输入
              <textarea id="ideaInput" placeholder="输入一个游戏想法，例如：一个面向移动端的轻量肉鸽卡牌游戏，核心体验是三分钟一局。"></textarea>
            </label>
            <label>
              补充上下文
              <textarea id="contextInput" class="small-textarea" placeholder="技术栈、目标平台、玩法约束、参考游戏等"></textarea>
            </label>
            <div class="button-row">
              <button class="primary-button" id="runWorkflowButton">运行三步工作流</button>
              <button class="ghost-button" id="runAgentButton">只运行当前 Agent</button>
            </div>
          </section>

          <section class="panel output-panel">
            <div class="panel-header">
              <div>
                <h2>输出</h2>
                <p>最近一次运行结果</p>
              </div>
              <span class="pill muted" id="lastRunMeta">EMPTY</span>
            </div>
            <pre class="output-box" id="outputBox">等待运行结果</pre>
          </section>
        </div>
      </section>

      <section class="view" id="runsView">
        <section class="panel full-panel">
          <div class="panel-header">
            <div>
              <h2>Agent 运行记录</h2>
              <p>按项目、类型、状态查看执行历史</p>
            </div>
            <div class="filter-row">
              <select id="runProjectFilter">
                <option value="">全部项目</option>
              </select>
              <select id="runTypeFilter">
                <option value="">全部类型</option>
                <option value="GAME_CONCEPT">GAME_CONCEPT</option>
                <option value="CORE_LOOP_DESIGN">CORE_LOOP_DESIGN</option>
                <option value="TASK_BREAKDOWN">TASK_BREAKDOWN</option>
                <option value="REQUIREMENT_BREAKDOWN">REQUIREMENT_BREAKDOWN</option>
                <option value="API_DESIGN">API_DESIGN</option>
                <option value="BUG_ANALYSIS">BUG_ANALYSIS</option>
                <option value="PROMPT_GENERATE">PROMPT_GENERATE</option>
              </select>
              <select id="runStatusFilter">
                <option value="">全部状态</option>
                <option value="RUNNING">RUNNING</option>
                <option value="SUCCESS">SUCCESS</option>
                <option value="FAILED">FAILED</option>
                <option value="TIMEOUT">TIMEOUT</option>
              </select>
              <select id="runPageSize">
                <option value="5">每页 5 条</option>
                <option value="10" selected>每页 10 条</option>
                <option value="20">每页 20 条</option>
              </select>
            </div>
          </div>
          <div class="table" id="runsTable"></div>
          <div class="pagination">
            <button class="ghost-button" id="prevRunsPageButton">上一页</button>
            <span id="runsPageText">第 1 页 / 共 1 页</span>
            <button class="ghost-button" id="nextRunsPageButton">下一页</button>
          </div>
        </section>
      </section>

      <section class="view" id="artifactsView">
        <section class="panel full-panel">
          <div class="panel-header">
            <div>
              <h2>产物库</h2>
              <p>当前项目下的结构化 Agent 输出</p>
            </div>
          </div>
          <div class="artifact-grid" id="artifactGrid"></div>
        </section>
      </section>

      <section class="view" id="settingsView">
        <section class="panel settings-panel">
          <div class="panel-header">
            <div>
              <h2>连接设置</h2>
              <p>本地 Java 后端地址</p>
            </div>
          </div>
          <label>
            API Base URL
            <input id="baseUrlInput" placeholder="http://localhost:8080" />
          </label>
          <button class="primary-button" id="saveSettingsButton">保存设置</button>
          <div class="message" id="settingsMessage"></div>
        </section>
      </section>
    </main>
  </div>

  <dialog id="projectDialog">
    <form method="dialog" class="dialog-card">
      <h2>新建游戏项目</h2>
      <label>
        项目名称
        <input id="projectName" placeholder="三分钟肉鸽卡牌" />
      </label>
      <label>
        游戏类型
        <input id="projectType" placeholder="Roguelike / Card / Puzzle" />
      </label>
      <label>
        目标平台
        <input id="projectPlatform" placeholder="Web / Mobile / PC" />
      </label>
      <label>
        项目描述
        <textarea id="projectDescription" class="small-textarea" placeholder="简要描述项目方向"></textarea>
      </label>
      <div class="button-row end">
        <button class="ghost-button" value="cancel">取消</button>
        <button class="primary-button" id="createProjectButton" value="default">创建</button>
      </div>
    </form>
  </dialog>

  <script src="./app.js"></script>
</body>
</html>
