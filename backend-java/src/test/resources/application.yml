spring:
  datasource:
    url: jdbc:mysql://localhost:3306/gamedev_agent_workbench_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: test_user
    password: test-only-database-password
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    # Unit and MVC tests must not require a locally provisioned MySQL account.
    # Deployment and dedicated migration checks use the main configuration.
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password:

app:
  jwt:
    secret: test-only-jwt-secret-at-least-32-bytes
    expire-seconds: 86400
  python:
    base-url: http://127.0.0.1:8000
    internal-token: test-only-python-agent-token-at-least-32-bytes

game-build:
  base-url: http://localhost:5173
