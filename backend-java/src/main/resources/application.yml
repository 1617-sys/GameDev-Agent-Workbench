spring:
  application:
    name: gamedev-agent-workbench
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/gamedev_agent_workbench?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:gamedev_app}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}

server:
  port: 8080

logging:
  charset:
    console: UTF-8
    file: UTF-8
  level:
    org.apache.ibatis: warn
    com.baomidou.mybatisplus: warn

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

app:
  jwt:
    secret: ${JWT_SECRET}
    expire-seconds: ${JWT_EXPIRE_SECONDS:86400}
  python:
    base-url: ${PYTHON_AGENT_BASE_URL:http://127.0.0.1:8000}
  workflow-rate-limit:
    policy-version: ${WORKFLOW_RATE_LIMIT_POLICY_VERSION:v1}
    max-submissions-per-window: ${WORKFLOW_RATE_LIMIT_MAX_SUBMISSIONS:5}
    window-seconds: ${WORKFLOW_RATE_LIMIT_WINDOW_SECONDS:60}
    retry-after-seconds: ${WORKFLOW_RATE_LIMIT_RETRY_AFTER_SECONDS:60}
    max-pending-runs: ${WORKFLOW_BACKPRESSURE_MAX_PENDING_RUNS:100}
  workflow-recovery:
    enabled: ${WORKFLOW_RECOVERY_ENABLED:true}
    scan-delay-ms: ${WORKFLOW_RECOVERY_SCAN_DELAY_MS:30000}
    batch-size: ${WORKFLOW_RECOVERY_BATCH_SIZE:50}
    pending-stale-ms: ${WORKFLOW_RECOVERY_PENDING_STALE_MS:300000}
    queued-stale-ms: ${WORKFLOW_RECOVERY_QUEUED_STALE_MS:300000}
    running-heartbeat-stale-ms: ${WORKFLOW_RECOVERY_RUNNING_HEARTBEAT_STALE_MS:120000}
    max-recovery-attempts: ${WORKFLOW_RECOVERY_MAX_ATTEMPTS:3}

game-build:
  base-url: ${GAME_BUILD_BASE_URL:http://localhost:5173}

knowledge:
  storage-root: ${KNOWLEDGE_STORAGE_ROOT:${java.io.tmpdir}/gamedev-knowledge}
  max-bytes: ${KNOWLEDGE_UPLOAD_MAX_BYTES:10485760}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
