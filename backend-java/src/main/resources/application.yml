spring:
  application:
    name: gamedev-agent-workbench
  ai:
    model:
      chat: openai
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      base-url: ${LLM_BASE_URL:https://api.deepseek.com}
      api-key: ${LLM_API_KEY}
      chat:
        options:
          model: ${LLM_MODEL:deepseek-chat}
          temperature: ${LLM_TEMPERATURE:0.7}
    retry:
      max-attempts: ${LLM_MAX_ATTEMPTS:3}
      backoff:
        initial-interval: ${LLM_RETRY_INITIAL_INTERVAL:500ms}
        multiplier: 2
        max-interval: ${LLM_RETRY_MAX_INTERVAL:4s}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/gamedev_agent_workbench?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:gamedev_app}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}

server:
  port: 8080

logging:
  charset:
    console: UTF-8
    file: UTF-8
  level:
    org.apache.ibatis: warn
    com.baomidou.mybatisplus: warn
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=${spring.application.name} traceId=%X{traceId:-none} workflowRunUuid=%X{workflowRunUuid:-none} stepRunUuid=%X{stepRunUuid:-none} agentRunUuid=%X{agentRunUuid:-none} messageId=%X{messageId:-none} logger=%logger{36} msg=%msg%n"

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

app:
  ai:
    provider: ${APP_AI_PROVIDER:spring-ai}
    model: ${LLM_MODEL:deepseek-chat}
    temperature: ${LLM_TEMPERATURE:0.7}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  observability:
    prometheus-anonymous-access: ${OBSERVABILITY_PROMETHEUS_ANONYMOUS_ACCESS:false}
  jwt:
    secret: ${JWT_SECRET}
    expire-seconds: ${JWT_EXPIRE_SECONDS:86400}
  python:
    base-url: ${PYTHON_AGENT_BASE_URL:http://127.0.0.1:8000}
    internal-token: ${PYTHON_AGENT_INTERNAL_TOKEN}
  player:
    model: ${PLAYER_MODEL:${LLM_MODEL:deepseek-chat}}
    http-timeout-ms: ${PLAYER_API_TIMEOUT_MS:120000}
    recovery-delay-ms: ${PLAYER_RUN_RECOVERY_DELAY_MS:30000}
  director:
    decision-timeout-ms: ${DIRECTOR_DECISION_TIMEOUT_MS:30000}
    recovery-delay-ms: ${DIRECTOR_RECOVERY_DELAY_MS:30000}
    claim-seconds: ${DIRECTOR_CLAIM_SECONDS:60}
    max-attempts: ${DIRECTOR_MAX_ATTEMPTS:3}
    experiment-wakeup-delay-ms: ${DIRECTOR_EXPERIMENT_WAKEUP_DELAY_MS:30000}
  cocos:
    executable: ${COCOS_CREATOR_EXECUTABLE:}
    runtime-project: ${COCOS_RUNTIME_PROJECT:}
    work-root: ${COCOS_BUILD_WORK_ROOT:${java.io.tmpdir}/gamedev-cocos-builds}
    artifact-root: ${COCOS_ARTIFACT_ROOT:${java.io.tmpdir}/gamedev-playable-artifacts}
    success-exit-codes: ${COCOS_SUCCESS_EXIT_CODES:36}
  workflow-rate-limit:
    policy-version: ${WORKFLOW_RATE_LIMIT_POLICY_VERSION:v1}
    max-submissions-per-window: ${WORKFLOW_RATE_LIMIT_MAX_SUBMISSIONS:5}
    window-seconds: ${WORKFLOW_RATE_LIMIT_WINDOW_SECONDS:60}
    retry-after-seconds: ${WORKFLOW_RATE_LIMIT_RETRY_AFTER_SECONDS:60}
    max-pending-runs: ${WORKFLOW_BACKPRESSURE_MAX_PENDING_RUNS:100}
  workflow-recovery:
    enabled: ${WORKFLOW_RECOVERY_ENABLED:true}
    scan-delay-ms: ${WORKFLOW_RECOVERY_SCAN_DELAY_MS:30000}
    batch-size: ${WORKFLOW_RECOVERY_BATCH_SIZE:50}
    pending-stale-ms: ${WORKFLOW_RECOVERY_PENDING_STALE_MS:300000}
    queued-stale-ms: ${WORKFLOW_RECOVERY_QUEUED_STALE_MS:300000}
    running-heartbeat-stale-ms: ${WORKFLOW_RECOVERY_RUNNING_HEARTBEAT_STALE_MS:120000}
    max-recovery-attempts: ${WORKFLOW_RECOVERY_MAX_ATTEMPTS:3}

game-build:
  base-url: ${GAME_BUILD_BASE_URL:http://localhost:5173}

knowledge:
  storage-root: ${KNOWLEDGE_STORAGE_ROOT:${java.io.tmpdir}/gamedev-knowledge}
  max-bytes: ${KNOWLEDGE_UPLOAD_MAX_BYTES:10485760}

management:
  server:
    port: ${MANAGEMENT_PORT:8080}
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis,rabbit
      show-details: never
      show-components: never
    env:
      enabled: false
    configprops:
      enabled: false
    shutdown:
      enabled: false
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# Model prompts and completions can contain private project material; never export them by default.
spring.ai.chat.client.observations.log-prompt: false
spring.ai.chat.client.observations.log-completion: false
spring.ai.chat.observations.log-prompt: false
spring.ai.chat.observations.log-completion: false
