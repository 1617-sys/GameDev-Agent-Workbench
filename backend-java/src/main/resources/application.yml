spring:
  application:
    name: gamedev-agent-workbench
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/gamedev_agent_workbench?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true

server:
  port: 8080

logging:
  charset:
    console: UTF-8
    file: UTF-8
  level:
    org.apache.ibatis: warn
    com.baomidou.mybatisplus: warn

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

data:
  redis:
    host: localhost
    port: 6379
    database: 0
    password: ${REDIS_PASSWORD:}

app:
  jwt:
    secret: ${JWT_SECRET}
    expire-seconds: ${JWT_EXPIRE_SECONDS:86400}
  python:
    base-url: ${PYTHON_AGENT_BASE_URL:http://127.0.0.1:8000}
  workflow-rate-limit:
    policy-version: ${WORKFLOW_RATE_LIMIT_POLICY_VERSION:v1}
    max-submissions-per-window: ${WORKFLOW_RATE_LIMIT_MAX_SUBMISSIONS:5}
    window-seconds: ${WORKFLOW_RATE_LIMIT_WINDOW_SECONDS:60}
    retry-after-seconds: ${WORKFLOW_RATE_LIMIT_RETRY_AFTER_SECONDS:60}
    max-pending-runs: ${WORKFLOW_BACKPRESSURE_MAX_PENDING_RUNS:100}

game-build:
  base-url: ${GAME_BUILD_BASE_URL:http://localhost:5173}
