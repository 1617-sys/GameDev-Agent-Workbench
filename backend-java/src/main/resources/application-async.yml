spring:
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        auto-startup: ${WORKFLOW_CONSUMER_ENABLED:true}

app:
  messaging:
    workflow-exchange: ${WORKFLOW_EXCHANGE:workflow.events}
    workflow-queue: ${WORKFLOW_QUEUE:workflow.run.execute}
    workflow-routing-key: ${WORKFLOW_ROUTING_KEY:workflow.run.requested}
    consumer:
      execution-lock-ttl-seconds: ${WORKFLOW_EXECUTION_LOCK_TTL_SECONDS:900}
    retry:
      max-attempts: ${WORKFLOW_RETRY_MAX_ATTEMPTS:3}
      first-delay-ms: ${WORKFLOW_RETRY_FIRST_DELAY_MS:30000}
      second-delay-ms: ${WORKFLOW_RETRY_SECOND_DELAY_MS:300000}
      third-delay-ms: ${WORKFLOW_RETRY_THIRD_DELAY_MS:1800000}
  outbox:
    publisher:
      batch-size: ${OUTBOX_PUBLISHER_BATCH_SIZE:20}
      poll-delay-ms: ${OUTBOX_PUBLISHER_POLL_DELAY_MS:1000}
      claim-lease-ms: ${OUTBOX_PUBLISHER_CLAIM_LEASE_MS:30000}
      retry-delay-ms: ${OUTBOX_PUBLISHER_RETRY_DELAY_MS:5000}
