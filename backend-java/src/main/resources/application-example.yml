spring:
  application:
    name: gamedev-agent-workbench
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/gamedev_agent_workbench?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:REPLACE_WITH_LOCAL_DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  rabbitmq:
    # Used only when the async profile is enabled.
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:REPLACE_WITH_LOCAL_RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD:REPLACE_WITH_LOCAL_RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.example.gameworkbench: info

app:
  jwt:
    secret: ${JWT_SECRET:REPLACE_WITH_AT_LEAST_32_CHAR_RANDOM_JWT_SECRET}
    expire-seconds: ${JWT_EXPIRE_SECONDS:86400}
  python:
    base-url: ${PYTHON_AGENT_BASE_URL:http://localhost:8000}

game-build:
  base-url: ${GAME_BUILD_BASE_URL:http://localhost:5173}
