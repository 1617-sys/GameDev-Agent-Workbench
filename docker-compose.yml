services:
  mysql:
    image: mysql:8.4
    command: ["mysqld", "--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gamedev_agent_workbench}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    mem_limit: 768m
    cpus: 1.0

  mysql-bootstrap:
    image: mysql:8.4
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gamedev_agent_workbench}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - ./docker/mysql/bootstrap/create-app-user.sh:/usr/local/bin/create-app-user.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/create-app-user.sh"]
    restart: "no"

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME must be set}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-5673}:5672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    mem_limit: 512m
    cpus: 0.75

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 256m
    cpus: 0.5

  python-agent:
    build:
      context: ./python-agent
    environment:
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
      LLM_ENABLE_MOCK_FALLBACK: ${LLM_ENABLE_MOCK_FALLBACK}
      PYTHON_AGENT_INTERNAL_TOKEN: ${PYTHON_AGENT_INTERNAL_TOKEN:?PYTHON_AGENT_INTERNAL_TOKEN must be set}
      SIMULATION_SERVICE_BASE_URL: http://simulation-service:8090
      SIMULATION_SERVICE_INTERNAL_TOKEN: ${SIMULATION_SERVICE_INTERNAL_TOKEN:?SIMULATION_SERVICE_INTERNAL_TOKEN must be set}
    depends_on:
      simulation-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PYTHON_AGENT_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/health', timeout=2).getcode() == 200"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    mem_limit: 512m
    cpus: 1.0

  simulation-service:
    build:
      context: ./frontend-vue
      dockerfile: Dockerfile.simulation-service
    environment:
      SIMULATION_SERVICE_INTERNAL_TOKEN: ${SIMULATION_SERVICE_INTERNAL_TOKEN:?SIMULATION_SERVICE_INTERNAL_TOKEN must be set}
      SIMULATION_SERVICE_PORT: 8090
      SIMULATION_SESSION_TTL_MS: ${SIMULATION_SESSION_TTL_MS:-300000}
      SIMULATION_MAX_SESSIONS: ${SIMULATION_MAX_SESSIONS:-100}
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    mem_limit: 512m
    cpus: 1.0

  backend-java:
    build:
      context: ./backend-java
    depends_on:
      mysql:
        condition: service_healthy
      mysql-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      python-agent:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-gamedev_agent_workbench}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRE_SECONDS: ${JWT_EXPIRE_SECONDS:-3600}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      PYTHON_AGENT_BASE_URL: http://python-agent:8000
      PYTHON_AGENT_INTERNAL_TOKEN: ${PYTHON_AGENT_INTERNAL_TOKEN:?PYTHON_AGENT_INTERNAL_TOKEN must be set}
      APP_AI_PROVIDER: ${APP_AI_PROVIDER:-spring-ai}
      DIRECTOR_DECISION_PROVIDER: ${DIRECTOR_DECISION_PROVIDER:-spring-ai}
      DIRECTOR_MODEL: ${DIRECTOR_MODEL:-deepseek-chat}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      PLAYER_MODEL: ${LLM_MODEL:-deepseek-chat}
      PLAYER_API_TIMEOUT_MS: ${PLAYER_API_TIMEOUT_MS:-120000}
      PLAYER_RUN_RECOVERY_DELAY_MS: ${PLAYER_RUN_RECOVERY_DELAY_MS:-30000}
      GAME_BUILD_BASE_URL: http://localhost:5173
      SPRING_PROFILES_ACTIVE: async
      JAVA_OPTS: -Dfile.encoding=UTF-8 -XX:InitialRAMPercentage=25.0 -XX:MaxRAMPercentage=75.0
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME must be set}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/actuator/health > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    mem_limit: 1024m
    cpus: 2.0

  frontend-vue:
    build:
      context: ./frontend-vue
    depends_on:
      backend-java:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    mem_limit: 256m
    cpus: 0.5

volumes:
  mysql-data:
  redis-data:
