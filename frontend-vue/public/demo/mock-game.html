<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameDev Agent Demo</title>
  <link rel="stylesheet" href="./mock-game.css" />
</head>
<body>
  <main class="shell">
    <section class="topbar">
      <div>
        <p class="eyebrow">AI Generated Playable Demo</p>
        <h1 id="gameTitle">Game Demo</h1>
        <p id="projectMeta" class="meta">projectUuid: -</p>
      </div>
      <div class="stats">
        <span>Gems <strong id="gemCount">0</strong>/3</span>
        <span id="gameStatus">RUNNING</span>
      </div>
    </section>

    <section class="game-area">
      <canvas id="gameCanvas" width="720" height="420" aria-label="Playable game demo"></canvas>
      <aside class="panel">
        <h2>Goal</h2>
        <p>Use WASD or arrow keys to collect 3 gems, then reach the portal.</p>
        <h2>Controls</h2>
        <p>Move: WASD / Arrow keys</p>
        <button id="restartButton" type="button">Restart</button>
      </aside>
    </section>
  </main>

  <script src="./mock-game.js"></script>
</body>
</html>
